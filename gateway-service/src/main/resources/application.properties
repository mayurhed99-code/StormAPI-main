spring.application.name=gateway-service
server.port=8080

spring.threads.virtual.enabled=true

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:stormapi}
spring.datasource.username=${MYSQL_USER:stormapi}
spring.datasource.password=${MYSQL_PASSWORD:stormapi}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# All services share one MySQL schema; each keeps its own Flyway history table.
spring.flyway.table=flyway_history_auth
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

stormapi.jwt.secret=${JWT_SECRET}
stormapi.jwt.ttl-ms=${JWT_TTL_MS:86400000}

management.endpoints.web.exposure.include=health,info
