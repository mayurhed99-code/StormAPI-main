worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # Health endpoints exposed through the gateway path prefixes
        # (Phases.md Phase 0: curl localhost/api/auth/actuator/health).
        location /api/auth/actuator/ {
            proxy_pass http://gateway-service:8080/actuator/;
        }
        location /api/test/actuator/ {
            proxy_pass http://execution-service:8080/actuator/;
        }
        location /api/metrics/actuator/ {
            proxy_pass http://report-service:8080/actuator/;
        }

        location /api/auth/ {
            proxy_pass http://gateway-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/test/ {
            proxy_pass http://execution-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/metrics/ {
            proxy_pass http://report-service:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket (STOMP) endpoint for live run metrics.
        location /ws {
            proxy_pass http://report-service:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # React SPA — client-side routing requires try_files fallback
        location / {
            root /app/dist;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively; index.html is not cached
            location ~* \.(js|css|woff2?|png|svg|ico|webp)$ {
                add_header Cache-Control "public, max-age=31536000, immutable";
                access_log off;
            }
        }
    }
}
